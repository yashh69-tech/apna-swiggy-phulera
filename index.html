<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Swiggy Phulera - Online Food Delivery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 110px;
    transition: background 0.3s, color 0.3s;
  }

  /* 🦇 BATMAN EDITION (Gotham Stealth / Gold) */
  body.theme-boys {
    --bg: #070709;
    --card: #111217;
    --card-border: #232630;
    --primary: #facc15;
    --primary-glow: rgba(250, 204, 21, 0.25);
    --text: #f8fafc;
    --sub: #94a3b8;
    --nav-bg: #050507;
    --bottom-bg: #0c0d12;
    --promo-bg: rgba(250, 204, 21, 0.08);
  }

  /* 🌸 ROSE EDITION (Pastel Pink) */
  body.theme-girls {
    --bg: #fff1f5;
    --card: #ffffff;
    --card-border: #fce7f3;
    --primary: #f43f5e;
    --primary-glow: rgba(244, 63, 94, 0.2);
    --text: #4c0519;
    --sub: #9f1239;
    --nav-bg: #ffe4ec;
    --bottom-bg: #ffffff;
    --promo-bg: rgba(244, 63, 94, 0.08);
  }

  body { background: var(--bg); color: var(--text); }

  header {
    background: var(--nav-bg);
    border-bottom: 1px solid var(--card-border);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-main { display: flex; justify-content: space-between; align-items: center; }
  .brand h1 { font-size: 17px; font-weight: 900; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
  .brand span { font-size: 10px; color: var(--primary); font-weight: 800; letter-spacing: 1px; }

  .theme-switch-bar { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .btn-theme {
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 800;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  body.theme-boys .btn-theme.active { background: #facc15; color: #000; box-shadow: 0 2px 8px var(--primary-glow); }
  body.theme-girls .btn-theme.active { background: #f43f5e; color: #fff; box-shadow: 0 2px 8px var(--primary-glow); }

  .cart-indicator {
    background: var(--primary);
    color: #000;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
  }
  body.theme-girls .cart-indicator { color: #fff; }

  .container { max-width: 580px; margin: 0 auto; padding: 14px; }

  .delivery-banner {
    background: var(--promo-bg);
    border: 1px dashed var(--primary);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
  }

  .shop-select-box {
    margin-bottom: 16px;
    background: var(--card);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }
  .shop-select-box label { font-size: 10px; color: var(--sub); margin-bottom: 6px; display: block; font-weight: 800; letter-spacing: 0.5px; }
  .shop-select-box select {
    width: 100%;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    outline: none;
  }

  .menu-title { font-size: 12px; color: var(--sub); font-weight: 900; letter-spacing: 1px; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .item-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .item-info h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .item-price { font-size: 14px; color: var(--primary); font-weight: 800; }

  .qty-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 4px 8px;
  }
  .btn-qty { background: none; border: none; color: var(--text); font-size: 16px; font-weight: bold; cursor: pointer; width: 22px; }
  .qty-val { font-size: 13px; font-weight: 800; min-width: 18px; text-align: center; }

  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bottom-bg);
    border-top: 1px solid var(--card-border);
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 99;
  }
  .total-info .label { font-size: 10px; color: var(--sub); font-weight: 700; letter-spacing: 0.5px; }
  .total-info .amount { font-size: 18px; font-weight: 900; color: var(--text); }
  .total-info .fee-status { font-size: 11px; font-weight: 800; }
  .fee-free { color: #22c55e; }
  .fee-charged { color: #f97316; }

  .btn-checkout {
    background: var(--primary);
    color: #000;
    border: none;
    font-weight: 800;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  body.theme-girls .btn-checkout { color: #fff; }

  #checkoutModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 101;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-sheet {
    background: var(--card);
    width: 100%;
    max-width: 520px;
    border-radius: 18px 18px 0 0;
    padding: 22px;
    border: 1px solid var(--card-border);
  }
  .modal-sheet h2 { font-size: 17px; margin-bottom: 12px; font-weight: 800; }
  .modal-sheet input, .modal-sheet textarea, .modal-sheet select {
    width: 100%;
    padding: 11px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    margin-bottom: 10px;
    font-size: 13px;
    outline: none;
  }
  .btn-send-order {
    width: 100%;
    background: #25d366;
    color: #0b0f17;
    font-weight: 900;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .btn-close {
    width: 100%;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--sub);
    padding: 9px;
    border-radius: 8px;
    margin-top: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
  }
</style>
</head>
<body class="theme-boys">

<header>
  <div class="header-main">
    <div class="brand">
      <h1 id="brandHeading">🦇 APNA SWIGGY</h1>
      <span id="themeBadge">BATMAN GOTHAM EDITION</span>
    </div>
    <div class="cart-indicator" onclick="openCheckout()">CART: <span id="cartCount">0</span></div>
  </div>

  <div class="theme-switch-bar">
    <button class="btn-theme active" id="btnBoys" onclick="setTheme('boys')">🦇 Batman Edition</button>
    <button class="btn-theme" id="btnGirls" onclick="setTheme('girls')">🌸 Rose Edition</button>
  </div>
</header>

<div class="container">
  <div class="delivery-banner" id="promoBanner">
    Free delivery on all orders above ₹199
  </div>

  <div class="shop-select-box">
    <label>SELECT OUTLET</label>
    <select id="shopSelect" onchange="switchShop()">
      <option value="station">Station Road Fast Food Corner</option>
      <option value="sweet">Shree Krishna Mishthan Bhandar</option>
      <option value="cafe">Town Central Cafe & Shakes</option>
    </select>
  </div>

  <div class="menu-title">
    <span>MENU CATALOG</span>
    <span id="mascotIcon">🦇 Gotham Mode</span>
  </div>
  <div id="menuContainer"></div>
</div>

<div class="bottom-bar">
  <div class="total-info">
    <div class="label">ESTIMATED TOTAL</div>
    <div class="amount">₹<span id="grandTotalDisplay">0</span></div>
    <div class="fee-status" id="deliveryStatusLabel">Delivery: ₹20</div>
  </div>
  <button class="btn-checkout" onclick="openCheckout()">PROCEED ➔</button>
</div>

<div id="checkoutModal">
  <div class="modal-sheet">
    <h2 id="checkoutTitle">Delivery Details</h2>
    <input type="text" id="custName" placeholder="Full Name">
    <input type="tel" id="custPhone" placeholder="10-Digit Mobile Number">
    <textarea id="custAddress" rows="2" placeholder="Street / Landmark / House No. (Phulera)"></textarea>
    
    <select id="custPayMode">
      <option value="Cash on Delivery">Cash on Delivery (COD)</option>
      <option value="UPI / QR Code">UPI / QR Code on Delivery</option>
    </select>

    <button class="btn-send-order" onclick="sendOrderViaWhatsApp()">PLACE ORDER VIA WHATSAPP</button>
    <button class="btn-close" onclick="closeCheckout()">Cancel</button>
  </div>
</div>

<script>
  const MY_DELIVERY_WHATSAPP = "917665219980"; 

  const FREE_DELIVERY_THRESHOLD = 199;
  const BASE_DELIVERY_FEE = 20;

  const menus = {
    station: [
      { id: 's1', name: 'Veg Cheese Burger', price: 60 },
      { id: 's2', name: 'Crispy French Fries', price: 70 },
      { id: 's3', name: 'Paneer Masala Patties', price: 35 },
      { id: 's4', name: 'Cold Coffee with Ice Cream', price: 60 }
    ],
    sweet: [
      { id: 'sw1', name: 'Special Pyaz Kachori (2 Pcs)', price: 40 },
      { id: 'sw2', name: 'Desi Ghee Samosa (2 Pcs)', price: 30 },
      { id: 'sw3', name: 'Kaju Katli (250g)', price: 240 },
      { id: 'sw4', name: 'Hot Gulab Jamun (4 Pcs)', price: 60 }
    ],
    cafe: [
      { id: 'c1', name: 'Cheesy Grilled Sandwich', price: 80 },
      { id: 'c2', name: 'Creamy White Sauce Pasta', price: 120 },
      { id: 'c3', name: 'Oreo Thick Shake', price: 70 },
      { id: 'c4', name: 'Farmhouse Pizza (Regular)', price: 130 }
    ]
  };

  let cart = {};

  function setTheme(theme) {
    const body = document.body;
    const btnB = document.getElementById('btnBoys');
    const btnG = document.getElementById('btnGirls');
    const brand = document.getElementById('brandHeading');
    const badge = document.getElementById('themeBadge');
    const mascot = document.getElementById('mascotIcon');

    if (theme === 'girls') {
      body.className = 'theme-girls';
      btnG.classList.add('active');
      btnB.classList.remove('active');
      brand.innerHTML = "🌸 APNA SWIGGY";
      badge.textContent = "ROSE EDITION • PHULERA";
      mascot.textContent = "🌸 Rose Mode";
    } else {
      body.className = 'theme-boys';
      btnB.classList.add('active');
      btnG.classList.remove('active');
      brand.innerHTML = "🦇 APNA SWIGGY";
      badge.textContent = "BATMAN GOTHAM EDITION • PHULERA";
      mascot.textContent = "🦇 Gotham Mode";
    }
  }

  function switchShop() {
    cart = {};
    renderMenu();
    updateCartUI();
  }

  function renderMenu() {
    const shop = document.getElementById('shopSelect').value;
    const items = menus[shop];
    const container = document.getElementById('menuContainer');
    container.innerHTML = "";

    items.forEach(item => {
      const qty = cart[item.id] ? cart[item.id].qty : 0;
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div class="item-info">
          <h3>${item.name}</h3>
          <div class="item-price">₹${item.price}</div>
        </div>
        <div class="qty-controls">
          <button class="btn-qty" onclick="changeQty('${item.id}', '${item.name}', ${item.price}, -1)">-</button>
          <span class="qty-val" id="qty_${item.id}">${qty}</span>
          <button class="btn-qty" onclick="changeQty('${item.id}', '${item.name}', ${item.price}, 1)">+</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function changeQty(id, name, price, delta) {
    if (!cart[id]) cart[id] = { name: name, price: price, qty: 0 };
    cart[id].qty += delta;

    if (cart[id].qty <= 0) {
      delete cart[id];
      const el = document.getElementById(`qty_${id}`);
      if(el) el.textContent = 0;
    } else {
      const el = document.getElementById(`qty_${id}`);
      if(el) el.textContent = cart[id].qty;
    }
    updateCartUI();
  }

  function updateCartUI() {
    let foodTotal = 0, count = 0;
    for (let id in cart) {
      foodTotal += cart[id].price * cart[id].qty;
      count += cart[id].qty;
    }

    const banner = document.getElementById('promoBanner');
    const feeLabel = document.getElementById('deliveryStatusLabel');
    let deliveryFee = 0;

    if (foodTotal === 0) {
      deliveryFee = 0;
      banner.textContent = "Free delivery on all orders above ₹199";
      feeLabel.textContent = `Delivery: ₹${BASE_DELIVERY_FEE}`;
      feeLabel.className = "fee-status";
    } else if (foodTotal >= FREE_DELIVERY_THRESHOLD) {
      deliveryFee = 0;
      banner.textContent = "Congratulations! Free Delivery Unlocked";
      feeLabel.textContent = "Delivery: FREE";
      feeLabel.className = "fee-status fee-free";
    } else {
      deliveryFee = BASE_DELIVERY_FEE;
      let left = FREE_DELIVERY_THRESHOLD - foodTotal;
      banner.textContent = `Add items worth ₹${left} more for Free Delivery`;
      feeLabel.textContent = `Delivery: +₹${BASE_DELIVERY_FEE}`;
      feeLabel.className = "fee-status fee-charged";
    }

    document.getElementById('cartCount').textContent = count;
    document.getElementById('grandTotalDisplay').textContent = foodTotal + deliveryFee;
  }

  function openCheckout() {
    if (Object.keys(cart).length === 0) {
      alert("Please select items from the menu first.");
      return;
    }
    document.getElementById('checkoutModal').style.display = 'flex';
  }

  function closeCheckout() {
    document.getElementById('checkoutModal').style.display = 'none';
  }

  function sendOrderViaWhatsApp() {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const addr = document.getElementById('custAddress').value.trim();
    const payMode = document.getElementById('custPayMode').value;
    const shopName = document.getElementById('shopSelect').options[document.getElementById('shopSelect').selectedIndex].text;

    if (!name || !phone || !addr) {
      alert("Please complete all delivery details (Name, Contact, Address).");
      return;
    }

    let billItemsText = "";
    let foodTotal = 0;

    for (let id in cart) {
      let sub = cart[id].price * cart[id].qty;
      foodTotal += sub;
      billItemsText += `• ${cart[id].name} x ${cart[id].qty} = ₹${sub}\n`;
    }

    let isFreeDelivery = foodTotal >= FREE_DELIVERY_THRESHOLD;
    let deliveryFee = isFreeDelivery ? 0 : BASE_DELIVERY_FEE;
    let grandTotal = foodTotal + deliveryFee;

    let rawMessage = `*--- NEW ORDER DISPATCH ---*\n` +
                     `*Outlet:* ${shopName}\n\n` +
                     `*ORDER SUMMARY:*\n${billItemsText}\n` +
                     `*Item Total:* ₹${foodTotal}\n` +
                     `*Delivery Fee:* ${isFreeDelivery ? "FREE (Offer Applied)" : "₹" + BASE_DELIVERY_FEE}\n` +
                     `*Total Payable:* ₹${grandTotal}\n` +
                     `*Payment Mode:* ${payMode}\n\n` +
                     `*CUSTOMER DETAILS:*\n` +
                     `• Name: ${name}\n` +
                     `• Contact: ${phone}\n` +
                     `• Address: ${addr}\n` +
                     `-----------------------------------`;

    const encodedMsg = encodeURIComponent(rawMessage);
    window.open(`https://api.whatsapp.com/send?phone=${MY_DELIVERY_WHATSAPP}&text=${encodedMsg}`, '_blank');
  }

  renderMenu();
</script>
</body>
</html>
