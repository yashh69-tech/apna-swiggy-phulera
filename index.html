<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phulera Eats - No Cap Food Delivery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 120px;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* 🦇 GOTHAM BAT-STEALTH (Gen Z Dark) */
  body.theme-batman {
    --bg: #090a0f;
    --card: #12151f;
    --card-border: #1e2433;
    --accent: #facc15;
    --accent-glow: rgba(250, 204, 21, 0.25);
    --text: #f8fafc;
    --sub: #94a3b8;
    --nav: #05070a;
    --bottom: #0e1118;
    --tag-bg: rgba(250, 204, 21, 0.12);
  }

  /* 🎀 COQUETTE / BARBIE CORE (Gen Z Pink) */
  body.theme-pink {
    --bg: #fff0f5;
    --card: #ffffff;
    --card-border: #fbcfe8;
    --accent: #f43f5e;
    --accent-glow: rgba(244, 63, 94, 0.25);
    --text: #4c0519;
    --sub: #9f1239;
    --nav: #ffe4ec;
    --bottom: #ffffff;
    --tag-bg: rgba(244, 63, 94, 0.12);
  }

  body { background: var(--bg); color: var(--text); }

  /* Header */
  header {
    background: var(--nav);
    border-bottom: 1px solid var(--card-border);
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-main { display: flex; justify-content: space-between; align-items: center; }
  .brand-title { font-size: 19px; font-weight: 900; letter-spacing: -0.5px; }
  .brand-tag { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }

  .cart-pill {
    background: var(--accent);
    color: #000;
    padding: 6px 14px;
    border-radius: 24px;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--accent-glow);
  }
  body.theme-pink .cart-pill { color: #fff; }

  /* Vibe Switcher */
  .vibe-switch-bar { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  .vibe-btn {
    padding: 7px 18px;
    font-size: 12px;
    font-weight: 800;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: 0.2s;
  }
  body.theme-batman .vibe-btn.active { background: var(--accent); color: #000; }
  body.theme-pink .vibe-btn.active { background: var(--accent); color: #fff; }

  .container { max-width: 580px; margin: 0 auto; padding: 16px; }

  /* Vibe Banners */
  .vibe-banner {
    background: var(--tag-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Outlet Selector */
  .outlet-box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .outlet-box label { font-size: 11px; font-weight: 900; color: var(--sub); display: block; margin-bottom: 8px; text-transform: uppercase; }
  .outlet-box select {
    width: 100%;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    outline: none;
  }

  .catalog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; font-weight: 900; color: var(--sub); }

  /* Cards */
  .card-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .card-item h3 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .card-item .price { font-size: 15px; font-weight: 900; color: var(--accent); }
  .card-item .tags { font-size: 10px; opacity: 0.7; font-weight: 700; }

  .stepper {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 4px 8px;
    gap: 8px;
  }
  .stepper button { background: none; border: none; color: var(--text); font-size: 18px; font-weight: 900; cursor: pointer; width: 24px; }
  .stepper span { font-size: 14px; font-weight: 900; min-width: 16px; text-align: center; }

  /* Floating Bottom Check */
  .checkout-strip {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bottom);
    border-top: 1px solid var(--card-border);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 99;
  }
  .checkout-strip .price-wrap span { font-size: 11px; font-weight: 800; color: var(--sub); display: block; }
  .checkout-strip .price-wrap h2 { font-size: 20px; font-weight: 900; }

  .order-btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-weight: 900;
    padding: 13px 24px;
    border-radius: 12px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  body.theme-pink .order-btn { color: #fff; }

  /* Modal */
  #orderModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 105;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet {
    background: var(--card);
    width: 100%;
    max-width: 520px;
    border-radius: 22px 22px 0 0;
    padding: 22px;
    border: 1px solid var(--card-border);
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet h2 { font-size: 18px; font-weight: 900; margin-bottom: 12px; }
  .sheet input, .sheet textarea, .sheet select {
    width: 100%;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--text);
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 600;
    outline: none;
  }

  .split-box {
    background: var(--bg);
    border: 1px dashed var(--card-border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 800;
  }
  .split-box input { width: 60px; margin-bottom: 0; padding: 6px; text-align: center; }

  .dispatch-btn {
    width: 100%;
    background: #22c55e;
    color: #000;
    font-weight: 900;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .close-modal-btn {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--sub);
    padding: 10px;
    margin-top: 6px;
    font-weight: 800;
    cursor: pointer;
    font-size: 12px;
  }
</style>
</head>
<body class="theme-batman">

<header>
  <div class="header-main">
    <div>
      <h1 class="brand-title" id="logoText">🦇 PHULERA EATS</h1>
      <div class="brand-tag" id="modeTag">GOTHAM EDITION • DROP ZERO</div>
    </div>
    <div class="cart-pill" onclick="openOrderSheet()">CART: <span id="cartCount">0</span></div>
  </div>

  <div class="vibe-switch-bar">
    <button class="vibe-btn active" id="btnBat" onclick="switchTheme('batman')">🦇 Gotham Stealth</button>
    <button class="vibe-btn" id="btnCoquette" onclick="switchTheme('pink')">🎀 Barbie Coquette</button>
  </div>
</header>

<div class="container">
  <div class="vibe-banner">
    <span id="bannerMsg">⚡ Free Delivery unlocked over ₹199</span>
    <span id="bannerMoji">🛵 Fast AF</span>
  </div>

  <div class="outlet-box">
    <label>Choose Spot</label>
    <select id="outletSelect" onchange="renderMenu()">
      <option value="station">Station Fast Food (Burgers & Cold Brews)</option>
      <option value="sweet">Shree Krishna (Samosa & Kaju Katli)</option>
      <option value="cafe">Town Central (Cheesy Fries & Pizzas)</option>
    </select>
  </div>

  <div class="catalog-header">
    <span>LATE NIGHT DROPS</span>
    <span id="mascotTag">Bat-Protocol Active</span>
  </div>

  <div id="itemsGrid"></div>
</div>

<div class="checkout-strip">
  <div class="price-wrap">
    <span>TOTAL BILL</span>
    <h2>₹<span id="totalDisplay">0</span></h2>
  </div>
  <button class="order-btn" onclick="openOrderSheet()">CHECKOUT ➔</button>
</div>

<div id="orderModal">
  <div class="sheet">
    <h2>Secure Your Drop</h2>
    
    <div class="split-box">
      <span>Split with squad?</span>
      <div>
        <input type="number" id="splitCount" min="1" max="10" value="1" oninput="calculateSplit()">
        <span style="font-size: 10px; opacity:0.8;">heads</span>
      </div>
    </div>
    <div id="splitResult" style="font-size: 11px; font-weight:800; color: var(--accent); margin-bottom: 10px;"></div>

    <input type="text" id="orderName" placeholder="What's your name?">
    <input type="tel" id="orderPhone" placeholder="10-digit WhatsApp number">
    <textarea id="orderAddress" rows="2" placeholder="Exact Location / Landmark / Room No. (Phulera)"></textarea>

    <select id="orderPay">
      <option value="UPI / QR Code on Delivery">📲 UPI / QR Scan on Drop</option>
      <option value="Cash on Delivery">💵 Cash on Delivery</option>
    </select>

    <button class="dispatch-btn" onclick="dispatchOrder()">DISPATCH VIA WHATSAPP</button>
    <button class="close-modal-btn" onclick="closeOrderSheet()">Close</button>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "917665219980";

  const menus = {
    station: [
      { id: 's1', name: 'Crispy Double-Cheese Burger', price: 60, tag: 'Bestseller 🔥', shop: 'Station Fast Food' },
      { id: 's2', name: 'Peri Peri Seasoned Fries', price: 70, tag: 'Must Try 🍟', shop: 'Station Fast Food' },
      { id: 's3', name: 'Stuffed Paneer Patties', price: 35, tag: 'Crispy ✨', shop: 'Station Fast Food' },
      { id: 's4', name: 'Iced Cold Coffee with Scoop', price: 60, tag: 'Chilled ☕', shop: 'Station Fast Food' }
    ],
    sweet: [
      { id: 'sw1', name: 'Special Masala Pyaz Kachori (2 Pcs)', price: 40, tag: 'Spicy 🥟', shop: 'Shree Krishna' },
      { id: 'sw2', name: 'Desi Ghee Samosa (2 Pcs)', price: 30, tag: 'Classic 🥟', shop: 'Shree Krishna' },
      { id: 'sw3', name: 'Premium Kaju Katli (250g)', price: 240, tag: 'Pure Desi 🍬', shop: 'Shree Krishna' },
      { id: 'sw4', name: 'Hot Sugar Syrup Gulab Jamun (4 Pcs)', price: 60, tag: 'Sweet Tooth 🍯', shop: 'Shree Krishna' }
    ],
    cafe: [
      { id: 'c1', name: 'Four-Cheese Grilled Sandwich', price: 80, tag: 'Cheesy 🥪', shop: 'Town Central' },
      { id: 'c2', name: 'Creamy Alfredo Pasta', price: 120, tag: 'Italian 🍝', shop: 'Town Central' },
      { id: 'c3', name: 'Oreo Blast Thickshake', price: 70, tag: 'Thick AF 🧋', shop: 'Town Central' },
      { id: 'c4', name: 'Farmhouse Loaded Pizza', price: 130, tag: 'Top Tier 🍕', shop: 'Town Central' }
    ]
  };

  let cart = {};

  function switchTheme(theme) {
    const b = document.body;
    const btnB = document.getElementById('btnBat');
    const btnP = document.getElementById('btnCoquette');
    const logo = document.getElementById('logoText');
    const tag = document.getElementById('modeTag');
    const mascot = document.getElementById('mascotTag');

    if (theme === 'pink') {
      b.className = 'theme-pink';
      btnP.classList.add('active');
      btnB.classList.remove('active');
      logo.innerHTML = "🎀 PHULERA EATS";
      tag.textContent = "COQUETTE PINK EDITION • CUTE VIBES";
      mascot.textContent = "Barbie Mode ✨";
    } else {
      b.className = 'theme-batman';
      btnB.classList.add('active');
      btnP.classList.remove('active');
      logo.innerHTML = "🦇 PHULERA EATS";
      tag.textContent = "GOTHAM STEALTH • DROP ZERO";
      mascot.textContent = "Bat-Protocol Active ⚡";
    }
  }

  function renderMenu() {
    const shopKey = document.getElementById('outletSelect').value;
    const items = menus[shopKey];
    const grid = document.getElementById('itemsGrid');
    grid.innerHTML = "";

    items.forEach(item => {
      const count = cart[item.id] ? cart[item.id].qty : 0;
      const card = document.createElement('div');
      card.className = 'card-item';
      card.innerHTML = `
        <div>
          <h3>${item.name}</h3>
          <div class="tags">${item.tag}</div>
          <div class="price">₹${item.price}</div>
        </div>
        <div class="stepper">
          <button onclick="updateItem('${item.id}', '${item.name}', ${item.price}, '${item.shop}', -1)">-</button>
          <span>${count}</span>
          <button onclick="updateItem('${item.id}', '${item.name}', ${item.price}, '${item.shop}', 1)">+</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function updateItem(id, name, price, shop, delta) {
    if (!cart[id]) cart[id] = { name: name, price: price, shop: shop, qty: 0 };
    cart[id].qty += delta;

    if (cart[id].qty <= 0) delete cart[id];

    renderMenu();
    updateCartStats();
  }

  function updateCartStats() {
    let sub = 0, count = 0;
    for (let k in cart) {
      sub += cart[k].price * cart[k].qty;
      count += cart[k].qty;
    }

    let delFee = sub >= 199 || sub === 0 ? 0 : 20;
    let total = sub + delFee;

    document.getElementById('cartCount').textContent = count;
    document.getElementById('totalDisplay').textContent = total;

    const banner = document.getElementById('bannerMsg');
    if (sub === 0) banner.textContent = "⚡ Free Delivery unlocked over ₹199";
    else if (sub >= 199) banner.textContent = "🎉 Free Delivery Unlocked (W Move!)";
    else banner.textContent = `Add ₹${199 - sub} more for FREE delivery`;

    calculateSplit();
  }

  function calculateSplit() {
    let total = parseInt(document.getElementById('totalDisplay').textContent) || 0;
    let heads = parseInt(document.getElementById('splitCount').value) || 1;
    if (heads < 1) heads = 1;
    let perHead = Math.ceil(total / heads);
    document.getElementById('splitResult').textContent = `👉 ₹${perHead} / person (${heads} gang members)`;
  }

  function openOrderSheet() {
    if (Object.keys(cart).length === 0) {
      alert("Cart empty hai bro! Pehle kuch mast select kar!");
      return;
    }
    calculateSplit();
    document.getElementById('orderModal').style.display = 'flex';
  }

  function closeOrderSheet() {
    document.getElementById('orderModal').style.display = 'none';
  }

  function dispatchOrder() {
    const name = document.getElementById('orderName').value.trim();
    const phone = document.getElementById('orderPhone').value.trim();
    const addr = document.getElementById('orderAddress').value.trim();
    const pay = document.getElementById('orderPay').value;

    if (!name || !phone || !addr) {
      alert("Address and Name miss mat kar bro! Pura details daalo.");
      return;
    }

    let itemsMap = {};
    let subTotal = 0;

    for (let id in cart) {
      let item = cart[id];
      if (!itemsMap[item.shop]) itemsMap[item.shop] = [];
      itemsMap[item.shop].push(item);
      subTotal += item.price * item.qty;
    }

    let orderList = "";
    for (let s in itemsMap) {
      orderList += `\n📍 *${s}*\n`;
      itemsMap[s].forEach(i => {
        orderList += `  • ${i.name} [x${i.qty}] = ₹${i.price * i.qty}\n`;
      });
    }

    let del = subTotal >= 199 ? 0 : 20;
    let grand = subTotal + del;

    let msg = `*⚡ NEW FOOD DROP: PHULERA EATS ⚡*\n` +
              `*Gang Member:* ${name} (${phone})\n` +
              `*Drop Location:* ${addr}\n` +
              `-------------------------------------\n` +
              `*ITEMS ORDERED:*` +
              orderList +
              `-------------------------------------\n` +
              `*Subtotal:* ₹${subTotal}\n` +
              `*Delivery:* ${del === 0 ? "FREE (Secured)" : "₹" + del}\n` +
              `*TOTAL TO PAY:* ₹${grand}\n` +
              `*Payment Option:* ${pay}\n\n` +
              `🚀 *Status:* Drop the order ASAP!`;

    window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(msg)}`, '_blank');
  }

  renderMenu();
</script>
</body>
</html>
