<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2nd Floor - Rent & Electricity Calculator</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --accent: #10b981;
    --accent-hover: #059669;
    --wa: #25d366;
    --wa-hover: #1eb956;
    --text: #f8fafc;
    --sub: #94a3b8;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 60px;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--text);
  }
  .header p {
    font-size: 13px;
    color: var(--sub);
    margin-top: 4px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .full-width {
    grid-column: span 2;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    background: #090d16;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus {
    border-color: var(--accent);
  }

  /* Live Summary Box */
  .summary-box {
    background: #090d16;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-top: 14px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 8px;
  }
  .summary-row.bold {
    color: var(--text);
    font-weight: 700;
  }
  .summary-row.total {
    border-top: 1px dashed var(--border);
    padding-top: 10px;
    margin-top: 10px;
    font-size: 17px;
    font-weight: 900;
    color: var(--accent);
  }

  /* Action Buttons */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn-wa {
    background: var(--wa);
    color: #fff;
  }
  .btn-wa:hover {
    background: var(--wa-hover);
  }
  .btn-save {
    background: var(--accent);
    color: #fff;
  }
  .btn-save:hover {
    background: var(--accent-hover);
  }
  .btn-print {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* History Table */
  .table-box {
    overflow-x: auto;
    margin-top: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    min-width: 450px;
  }
  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--sub);
    font-weight: 700;
  }
  .btn-del {
    background: transparent;
    border: none;
    color: var(--danger);
    font-size: 13px;
    cursor: pointer;
    font-weight: bold;
  }

  /* Print Receipt Styling */
  @media print {
    body {
      background: #fff;
      color: #000;
      padding: 0;
    }
    .header, .btn-group, .card:not(#receiptCard), .history-section {
      display: none !important;
    }
    #receiptCard {
      background: #fff !important;
      color: #000 !important;
      border: 1px solid #000 !important;
      box-shadow: none !important;
      max-width: 100%;
    }
    .summary-box {
      background: #f8fafc !important;
      border: 1px solid #ccc !important;
    }
    .summary-row, .summary-row.bold, .summary-row.total {
      color: #000 !important;
    }
  }
</style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>🏠 2nd FLOOR RENT & ELECTRICITY</h1>
    <p>Monthly Calculation & WhatsApp Receipt Generator</p>
  </div>

  <div class="card" id="receiptCard">
    <div class="form-grid">
      <div>
        <label>Billing Month</label>
        <select id="billMonth" onchange="calcTotal()">
          <option>January</option>
          <option>February</option>
          <option>March</option>
          <option>April</option>
          <option>May</option>
          <option>June</option>
          <option>July</option>
          <option>August</option>
          <option>September</option>
          <option>October</option>
          <option>November</option>
          <option>December</option>
        </select>
      </div>

      <div>
        <label>Tenant Name / Room</label>
        <input type="text" id="tenantName" value="2nd Floor Family" placeholder="Tenant Name">
      </div>

      <div>
        <label>Previous Reading (Old)</label>
        <input type="number" id="prevReading" placeholder="e.g. 1200" oninput="calcTotal()">
      </div>

      <div>
        <label>Current Reading (New)</label>
        <input type="number" id="currReading" placeholder="e.g. 1320" oninput="calcTotal()">
      </div>

      <div>
        <label>Unit Rate (₹ / Unit)</label>
        <input type="number" id="unitRate" value="8.5" step="0.1" oninput="calcTotal()">
      </div>

      <div>
        <label>Monthly Room Rent (₹)</label>
        <input type="number" id="baseRent" value="6000" placeholder="Rent Amount" oninput="calcTotal()">
      </div>

      <div class="full-width">
        <label>Extra / Water Charge (₹)</label>
        <input type="number" id="extraCharge" value="0" placeholder="Optional charge" oninput="calcTotal()">
      </div>

      <div class="full-width">
        <label>Tenant WhatsApp Number (Optional)</label>
        <input type="tel" id="tenantPhone" placeholder="91XXXXXXXXXX (Direct Chat ke liye)">
      </div>
    </div>

    <!-- Live Breakdown Box -->
    <div class="summary-box">
      <div class="summary-row">
        <span>Units Consumed:</span>
        <span id="lblUnits">0 units</span>
      </div>
      <div class="summary-row">
        <span>Electricity Cost (<span id="lblRate">8.5</span>/u):</span>
        <span id="lblElecBill">₹0</span>
      </div>
      <div class="summary-row">
        <span>Base Rent:</span>
        <span id="lblRent">₹6,000</span>
      </div>
      <div class="summary-row" id="rowExtra" style="display:none;">
        <span>Other Charges:</span>
        <span id="lblExtra">₹0</span>
      </div>
      <div class="summary-row total">
        <span>TOTAL DUE:</span>
        <span id="lblTotal">₹6,000</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-wa" onclick="sendWhatsApp()">
        <span>📲 Share Bill on WhatsApp</span>
      </button>
      <button class="btn btn-save" onclick="saveRecord()">
        <span>💾 Save This Month Record</span>
      </button>
      <button class="btn btn-print" onclick="window.print()">
        <span>🖨️ Print / Download Slip</span>
      </button>
    </div>
  </div>

  <!-- History Section -->
  <div class="card history-section">
    <label>Saved Records History</label>
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>Month</th>
            <th>Readings</th>
            <th>Units</th>
            <th>Elec. Bill</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <!-- Populated from LocalStorage -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // Set current month automatically
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById('billMonth').value = months[new Date().getMonth()];

  function calcTotal() {
    const prev = parseFloat(document.getElementById('prevReading').value) || 0;
    const curr = parseFloat(document.getElementById('currReading').value) || 0;
    const rate = parseFloat(document.getElementById('unitRate').value) || 8.5;
    const rent = parseFloat(document.getElementById('baseRent').value) || 0;
    const extra = parseFloat(document.getElementById('extraCharge').value) || 0;

    let units = 0;
    if (curr >= prev && prev > 0) {
      units = curr - prev;
    }

    const elecTotal = Math.round(units * rate);
    const grandTotal = Math.round(elecTotal + rent + extra);

    document.getElementById('lblUnits').textContent = units + " units";
    document.getElementById('lblRate').textContent = rate;
    document.getElementById('lblElecBill').textContent = "₹" + elecTotal.toLocaleString('en-IN');
    document.getElementById('lblRent').textContent = "₹" + rent.toLocaleString('en-IN');
    
    if (extra > 0) {
      document.getElementById('rowExtra').style.display = 'flex';
      document.getElementById('lblExtra').textContent = "₹" + extra.toLocaleString('en-IN');
    } else {
      document.getElementById('rowExtra').style.display = 'none';
    }

    document.getElementById('lblTotal').textContent = "₹" + grandTotal.toLocaleString('en-IN');

    return { prev, curr, rate, units, elecTotal, rent, extra, grandTotal };
  }

  function sendWhatsApp() {
    const data = calcTotal();
    const month = document.getElementById('billMonth').value;
    const tenant = document.getElementById('tenantName').value || "Tenant";
    const phone = document.getElementById('tenantPhone').value.trim();

    const message = 
`*RENT & ELECTRICITY BILL - ${month.toUpperCase()}* 🏠
--------------------------------
Hello *${tenant}*,

Here are the billing details for *${month}*:

⚡ *Electricity Meter:*
• Previous Reading: ${data.prev}
• Current Reading: ${data.curr}
• Total Units Consumed: *${data.units} units*
• Rate per Unit: ₹${data.rate}
• Electricity Bill: *₹${data.elecTotal.toLocaleString('en-IN')}*

🏠 *Room Rent:* ₹${data.rent.toLocaleString('en-IN')}
${data.extra > 0 ? `➕ *Extra / Other Charges:* ₹${data.extra.toLocaleString('en-IN')}\n` : ''}--------------------------------
💰 *TOTAL PAYABLE: ₹${data.grandTotal.toLocaleString('en-IN')}*
--------------------------------
_Please send payment via UPI / Cash once verified. Thank you!_`;

    const encodedMsg = encodeURIComponent(message);
    let waUrl = `https://wa.me/?text=${encodedMsg}`;
    if (phone) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      waUrl = `https://wa.me/${cleanPhone}?text=${encodedMsg}`;
    }

    window.open(waUrl, '_blank');
  }

  function saveRecord() {
    const data = calcTotal();
    const month = document.getElementById('billMonth').value;
    const year = new Date().getFullYear();

    const record = {
      id: Date.now(),
      month: `${month} ${year}`,
      readings: `${data.prev} → ${data.curr}`,
      units: data.units,
      elec: data.elecTotal,
      total: data.grandTotal
    };

    let history = JSON.parse(localStorage.getItem('tenant_bill_records') || '[]');
    history.unshift(record);
    localStorage.setItem('tenant_bill_records', JSON.stringify(history));

    // Next time previous reading automatically becomes this month current
    if (data.curr > 0) {
      document.getElementById('prevReading').value = data.curr;
      document.getElementById('currReading').value = "";
    }

    renderHistory();
    alert("Record successfully saved!");
  }

  function deleteRecord(id) {
    let history = JSON.parse(localStorage.getItem('tenant_bill_records') || '[]');
    history = history.filter(item => item.id !== id);
    localStorage.setItem('tenant_bill_records', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem('tenant_bill_records') || '[]');
    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';

    if (history.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--sub);">No previous records saved yet.</td></tr>';
      return;
    }

    history.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${item.month}</strong></td>
        <td>${item.readings}</td>
        <td>${item.units} u</td>
        <td>₹${item.elec.toLocaleString('en-IN')}</td>
        <td style="color:var(--accent); font-weight:bold;">₹${item.total.toLocaleString('en-IN')}</td>
        <td><button class="btn-del" onclick="deleteRecord(${item.id})">✕</button></td>
      `;
      tbody.appendChild(tr);
    });

    // Auto set previous reading from latest record if field is empty
    if (history.length > 0 && !document.getElementById('prevReading').value) {
      const lastReading = history[0].readings.split('→')[1];
      if (lastReading) {
        document.getElementById('prevReading').value = lastReading.trim();
        calcTotal();
      }
    }
  }

  // Initial Run
  renderHistory();
  calcTotal();
</script>
</body>
</html>
